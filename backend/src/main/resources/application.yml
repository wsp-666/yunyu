server:
  port: 8080

spring:
  application:
    name: yunyu-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/yunyu?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: YOUR_MYSQL_PASSWORD
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

yunyu:
  jwt:
    secret: CHANGE_ME_TO_A_LONG_RANDOM_SECRET
    expire: 604800 # 7天
  minio:
    endpoint: http://localhost:9000
    access-key: YOUR_MINIO_ACCESS_KEY
    secret-key: YOUR_MINIO_SECRET_KEY
    bucket: yunyu
  weather:
    api-key: YOUR_WEATHER_OR_LLM_KEY
  deepseek:
    api-key: YOUR_DEEPSEEK_API_KEY
    base-url: https://api.deepseek.com
    model: deepseek-chat
